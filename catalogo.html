  if(/^PSBR(60|75|100|125)D$/.test(m))return"psbr60d";if(/^PSBR(150|200|250)D$/.test(m))return"psbr150d";
  if(it.fam==="PS H")return"psh";if(it.fam==="PS B")return"psb";
  if(it.fam==="Vertical c/ rodas"||it.fam==="Gasolina")return"pbv";if(it.tipo==="Pistão")return"pb";
  if(it.fam==="PBF pistão")return"pbf";if(/^PBH(153|200|240)/.test(m))return"pbh1";if(/^PBH(400|480)/.test(m))return"pbh2";if(/^PBH720/.test(m))return"pbh3";
  if(it.fam==="Scroll")return"scr";if(m==="PSBBS400")return"bs400";if(it.booster)return"psbc";
  if(/^TMB/.test(m))return"tmb";if(/^DPS/.test(m))return"dps";if(/^SPS/.test(m))return"sps";if(/^H[LU]/.test(m))return"ads";return"fps";}

// ---------- Ficha técnica (montada a partir dos dados do catálogo) ----------
function ficha(it){
  const i=it.info||"", g=(re)=>{const m=i.match(re);return m?m[1].trim():null};
  let trans=null;
  if(/ímã permanente/i.test(i))trans="Acoplamento direto · motor de ímã permanente com inversor";
  else if(/autocompensador/i.test(i))trans="Polia e correia (tensionador autocompensador)";
  else if(/Polia e correia/i.test(i))trans="Polia e correia";
  else if(/Acoplamento direto/i.test(i))trans="Acoplamento direto";
  else if(/Scroll/i.test(i))trans="Scroll (espiral)";
  let partida=null;
  if(/estrela-triângulo/i.test(i))partida="Estrela-triângulo";
  else if(/inversor/i.test(i))partida="Inversor de frequência (de série)";
  const motor=/gasolina/i.test(i)?"Gasolina · consumo "+(g(/consumo ([\d,]+ L\/h)/)||"—"):"Elétrico";
  const tensao=(()=>{const parts=i.split("·").map(x=>x.trim());const t=parts.reverse().find(x=>/\d{3}\/\d/.test(x)||/^110\/1/.test(x));return t?t.replace(/\.\s*Obs\..*$/,"").replace(/^ou\s+/,""):null})();
  const pmax=Math.max(...it.pts.map(p=>p[0]));
  const lub=it.tipo==="Isento de óleo"?"Isento de óleo (ar livre de óleo)":it.booster?"Booster (eleva a pressão do ar já comprimido)":"Lubrificado a óleo";
  const montagem=/Vertical/i.test(i)?"Vertical"+(/rodas/i.test(i)?" com rodas":""):/Horizontal/i.test(i)?"Horizontal":null;
  const linha=/Linha econômica/i.test(i)?"Linha econômica":/odonto/i.test(i)?"Linha odontológica":/classe zero/i.test(i)?"Classe zero (ISO 8573-1)":null;
  const cab=g(/(\d+ cabeçotes de [\d,]+ cv)/);
  const rows=[
    ["Tipo",it.tipo+" · linha "+it.fam],
    ["Transmissão",trans],
    ["Partida",partida],
    ["Motor",motor],
    ["Potência",fmt(it.cv,1)+" cv · "+fmt(it.kw,2)+" kW"+(cab?" ("+cab+")":"")],
    ["Lubrificação",lub],
    ["Pressão máxima",fmt(pmax,1)+" bar ("+fmt(pmax*14.5038)+" psi)"],
    ["Montagem",montagem],
    ["Linha",linha],
    ["Ruído",g(/(\d+ dB)/)],
    ["Reservatório",g(/reservatório (\d+ L)/)],
    ["Secador",/secador integrado opcional/i.test(i)?"Integrado (opcional)":g(/secador ([\d,]+ kW)/)?"Integrado · "+g(/secador ([\d,]+ kW)/):null],
    ["Saída de ar",g(/saída ([^·,]+)/)],
    ["Entrada de ar",it.booster?g(/(Entrada [^·]+)/):null],
    ["Pré-filtro",g(/pré-filtro ([^·]+)/)],
    ["Dimensões",g(/(\d+x\d+x\d+ cm)/)],
    ["Peso",g(/([\d,]+ kg)/)],
    ["Tensão (V/fases/Hz)",tensao],
  ];
  const lin=rows.filter(r=>r[0]!=="Montagem"&&r[0]!=="Linha"&&r[0]!=="Partida"&&r[0]!=="Pré-filtro"&&r[0]!=="Entrada de ar"&&r[0]!=="Secador"&&r[0]!=="Reservatório"||r[1]).map(([k,v])=>`<tr><td>${k}</td><td>${v||'<span class="nd">não consta no catálogo · confirmar com a Puma</span>'}</td></tr>`).join("");
  return{trans,html:`<div class="ficha"><h3>Ficha técnica</h3><table><tbody>${lin}</tbody></table></div>`};
}

const LPCM=28.3168;
const $=s=>document.querySelector(s);
const fmt=(n,d=0)=>n.toLocaleString("pt-BR",{maximumFractionDigits:d,minimumFractionDigits:0});
function toL(v,u){return u==="lmin"?v:u==="m3h"?v/0.06:v*LPCM}
function interp(tbl,x){if(x<=tbl[0][0])return tbl[0][1];for(let i=1;i<tbl.length;i++){if(x<=tbl[i][0]){const[a,fa]=tbl[i-1],[b,fb]=tbl[i];return fa+(fb-fa)*(x-a)/(b-a)}}return tbl[tbl.length-1][1]}
function flowAt(it,P){
  const pts=it.pts;
  if(it.single){const[b,pcm,l]=pts[0];return P<=b+1e-9?{l,pcm,kind:"max"}:null}
  const min=pts[0][0],max=pts[pts.length-1][0];
  if(P>max+1e-9)return null;
  if(it.booster&&P<min-1e-9)return null;
  if(P<=min){return{l:pts[0][2],pcm:pts[0][1],kind:P<min?"below":"exact"}}
  for(let i=0;i<pts.length;i++){if(Math.abs(pts[i][0]-P)<1e-9)return{l:pts[i][2],pcm:pts[i][1],kind:"exact"}}
  for(let i=1;i<pts.length;i++){if(P<pts[i][0]){const a=pts[i-1],b=pts[i],t=(P-a[0])/(b[0]-a[0]);return{l:a[2]+(b[2]-a[2])*t,pcm:a[1]+(b[1]-a[1])*t,kind:"approx"}}}
  return null;
}

function compCard(it,f,L,P,best){
  const margin=L?((f.l-L)/L)*100:null;
  const fx=ficha(it);
  const chips=[`<span class="chip dim">${it.tipo} · ${it.fam}</span>`,`<span class="chip dim">${fmt(it.cv,1)} cv · ${fmt(it.kw,2)} kW</span>`,fx.trans?`<span class="chip tr">${fx.trans.split(" · ")[0].replace(" (tensionador autocompensador)","")}</span>`:`<span class="chip dim">transmissão: ver ficha</span>`];
  if(best)chips.unshift(`<span class="chip hit">Menor que atende</span>`);
  if(KIT_PECAS[it.m])chips.push(`<span class="chip tr">Peças de manutenção</span>`);
  if(margin!=null)chips.push(margin>=0?`<span class="chip ok">sobra ${fmt(margin)}%</span>`:`<span class="chip dim">falta ${fmt(-margin)}%</span>`);
  if(f.kind==="approx")chips.push(`<span class="chip dim">≈ interpolado entre pontos</span>`);
  if(f.kind==="max")chips.push(`<span class="chip dim">pressão máx. ${it.pts[0][0]} bar</span>`);
  if(f.kind==="below")chips.push(`<span class="chip dim">vazão a ${it.pts[0][0]} bar (mínimo garantido)</span>`);
  const rows=it.pts.map(p=>`<tr class="${Math.abs(p[0]-P)<1e-9||(it.single)?"on":""}"><td>${p[0]} bar${it.booster?" saída":""}</td><td>${fmt(p[0]*14.5038)} psi</td><td>${fmt(p[2])}</td><td>${fmt(p[2]*0.06,1)}</td><td>${fmt(p[1],1)}</td></tr>`).join("");
  const on=sel.includes(it.m);
  chips.push(`<button type="button" class="cmpbtn" data-cmp="${it.m}" aria-pressed="${on}">${on?"✓ Comparando":"+ Comparar"}</button>`);
  return`<details class="card${best?" best":""}"><summary>
    ${ph(imgKey(it),it.m)}
    <span class="name">${it.m}</span>
    <span class="flow"><span class="big">${fmt(f.l)}</span> <span class="u">L/min</span><br><span class="u">${fmt(f.l*0.06,1)} m³/h · ${fmt(f.pcm,1)} pcm</span></span>
    <span class="tag">${it.single?"vazão nominal":it.booster?"vazão de saída a "+fmt(P,1)+" bar":"a "+fmt(P,1)+" bar"}</span>
    <span class="chips">${chips.join("")}</span></summary>
    <div class="det"><div class="bigph"><img src="${IMG[imgKey(it)]||""}" alt="Foto ${it.m}" loading="lazy"></div><p class="note" style="margin:0">Foto ilustrativa da linha (catálogo Puma).</p>${fx.html}${pecasHtml(it)}<div class="tbl"><h3 style="margin:6px 0 0">Vazão por pressão</h3><table><thead><tr><th>Pressão</th><th>psi</th><th>L/min</th><th>m³/h</th><th>pcm</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="info"><b>Dados do catálogo:</b> ${it.info}</p>${it.pts.length===2&&!it.single?'<p class="note">Catálogo informa só a faixa (mín.~máx.); valores intermediários são estimados em linha reta.</p>':""}</div></details>`;
}
function renderComps(L,P){
  let items=C.filter(it=>tab==="Todos"||it.tipo===tab);
  if(tab==="Todos")items=items.filter(it=>!it.booster||P>16);
  if(P==null)return`<div class="empty">Informe a pressão de trabalho.</div>`;
  let rows=items.map(it=>({it,f:flowAt(it,P)})).filter(r=>r.f);
  if(tab==="Booster"&&P<=16){
    // Booster recebe o ar do compressor e eleva a pressão: mostra a linha toda pela pressão mínima de saída
    const bs=C.filter(it=>it.booster).map(it=>({it,P0:it.pts[0][0]}));
    return`<div class="warn">Booster eleva a pressão do ar que já sai do compressor (entrada 7 a 13 bar → saída de 25 a 40 bar). A pressão no topo está em ${fmt(P,1)} bar: para ver quais atendem, informe a <b>pressão de saída</b> que o cliente precisa (ex.: 30 bar).</div>
    <div class="bar"><span>${bs.length} boosters Puma · vazão de saída na menor pressão de cada um</span></div>`+bs.map(b=>compCard(b.it,flowAt(b.it,b.P0),null,b.P0,false)).join("");
  }
  if(!rows.length)return`<div class="empty">Nenhum modelo desta linha trabalha a ${fmt(P,1)} bar.${P>16?" Acima de 16 bar, veja a aba Booster.":""}</div>`;
  rows.sort((a,b)=>a.f.l-b.f.l);
  const ok=L?rows.filter(r=>r.f.l>=L):rows;
  const list=showAll||!L?rows:ok;
  const bestM=L&&ok.length?ok[0].it.m:null;
  const head=`<div class="bar"><span>${L?`${ok.length} de ${rows.length} modelos atendem a ${fmt(P,1)} bar`:`${rows.length} modelos a ${fmt(P,1)} bar`}</span>
    <label for="all"><input id="all" type="checkbox" ${showAll?"checked":""}> Mostrar todos nessa pressão</label></div>`;
  if(!list.length)return head+`<div class="empty">Nenhum modelo desta linha entrega essa vazão sozinho a ${fmt(P,1)} bar. Considere dois compressores em paralelo ou outra linha.</div>`;
  return head+list.map(r=>compCard(r.it,r.f,L,P,r.it.m===bestM)).join("");
}
function renderTreat(L,P){
  if(L==null||P==null)return`<div class="empty">Informe vazão e pressão para dimensionar secador e filtro.</div>`;
  return`<p class="note" style="margin:0">Menor modelo de cada linha que atende ${fmt(L)} L/min a ${fmt(P,1)} bar. Use a vazão do compressor, não só a do consumo.</p>`+T.map(g=>{

    const fc=g.f?interp(g.f,P):1;

      <span class="flow">${pick?`<span class="big">${pick.r[0]}</span><br><span class="u">${fmt(pick.eff)} L/min efetivo</span>`:`<span class="u">acima da linha</span>`}</span>

  }).join("");
}

function calcEcon(L,P){
  const m=pickModel(ec.model,L,P),it=C.find(c=>c.m===m),f=P?flowAt(it,P):null;
  const dem=numd(ec.uso)>0?numd(ec.uso):(L?L/LPCM:NaN);
  const r={m,it,f,dem};
  if(!f||!(dem>0))return r;
  const hm=numd(ec.horas)*numd(ec.dias),tar=numd(ec.tarifa);
  const Pa=numd(ec.cv)*KWCV/0.88, realA=numd(ec.pcm)*numd(ec.rend)/100;
  let cA=dem/realA; r.atualFalta=cA>1; cA=Math.min(cA,1);
  const fracA=ec.tipo==="pistao"?cA:cA+0.3*(1-cA);
  const Pn=it.kw/0.92; let cN=dem/f.pcm; r.novoFalta=cN>1; cN=Math.min(cN,1);
  const inv=ec.inv||it.m==="PSBR30PM";r.inv=inv;
  const fracN=it.tipo==="Pistão"||it.single?cN:(inv?Math.max(cN,0.2)*1.03:cN+0.3*(1-cN));

  const pz=num(ec.preco);if(pz>0&&r.eco>0)r.payback=pz/r.eco;
  return r;
}

// Fator de utilização típico (% do tempo que a ferramenta fica realmente consumindo ar). Pode ser ajustado em cada linha.
const FT_USO={"Pistolas de pintura":60,"Tanques de pintura":30,"Chaves de impacto":15,"Chaves de impacto (kits)":15,"Martelos rompedores":30,
 "Parafusadeiras":15,"Torqueadeiras":10,"Furadeiras":25,"Retíficas":30,"Esmerilhadeiras":35,"Lixadeiras":40,"Chaves catraca":15,
 "Grampeadores, pinadores e pregadores":10,"Rebitadores":10,"Serras":25,"Serras e outras":20,"Martelo":20,"Desincrustadores":30,
 "Marteletes":20,"Máquinas de arquear":10,"Politrizes":40,"Desbaste":35,"Tesouras e canetas":15,"Puxador":10,
 "Pistolas de jateamento":50,"Faca e desponteadeira":20};
const ftUsoPadrao=x=>/Calafetador/.test(x.sub)?15:/Engraxadeira/.test(x.sub)?10:(FT_USO[x.cat]||25);
const ftUso=x=>{const v=numd(ftu[x.m]);return v>0?Math.min(v,100):ftUsoPadrao(x)};
// Fator de simultaneidade pelo número total de ferramentas (nem todas consomem ao mesmo tempo)
const FT_SIM=[1,1,.94,.89,.86,.83,.80,.77,.75,.73,.71,.69,.68,.67,.66,.65];
const ftSim=n=>n<=0?1:n<FT_SIM.length?FT_SIM[n]:n<=20?.64:.6;
const ftSave=()=>{try{localStorage.setItem("cp_ft",JSON.stringify(ftl));localStorage.setItem("cp_ftu",JSON.stringify(ftu))}catch(e){};store("cp_ftcfg",ftcfg)};
const FTCATS=["Todas",...[...new Set(FT.map(x=>x.cat))]];
const ftPcm=l=>l/LPCM;
function ftCard(x){

      </tbody></table></div>${x.obs?`<p class="info">${esc(x.obs)}</p>`:""}
      <p class="note" style="margin:0">Consumo instantâneo informado pela Puma a 90 psi (≈ 6,2 bar).</p></div></details>`;

function ftCalc(){
  const linhas=Object.entries(ftl).map(([m,q])=>({x:FT.find(f=>f.m===m),q:+q||0})).filter(r=>r.x&&r.q>0)
    .map(r=>({...r,uso:ftUso(r.x),pico:r.x.lmin*r.q,media:r.x.lmin*r.q*ftUso(r.x)/100}));
  const n=linhas.reduce((s,r)=>s+r.q,0);
  const bruto=linhas.reduce((s,r)=>s+r.pico,0);
  const media=linhas.reduce((s,r)=>s+r.media,0);
  const fs=ftSim(n), uso=media*fs;
  // uma ferramenta de uso contínuo (50% ou mais) precisa ser atendida sozinha, sem depender do reservatório
  const cont=Math.max(0,...linhas.filter(r=>r.uso>=50).map(r=>r.x.lmin));
  const rec=Math.max(uso*(ftcfg.folga?1.2:1),cont);
  return{linhas,n,bruto,media,fs,uso,rec,cont};
}

     ${c.linhas.map(r=>`<tr><td><b>${esc(r.x.m)}</b> <button type="button" class="ftrm" data-m="${esc(r.x.m)}" aria-label="Remover">✕</button><br><span class="note">${esc(r.x.sub||r.x.cat)} · ${fmt(r.x.lmin)} L/min<br>média ${fmt(r.media)} L/min</span></td>
       <td><input class="ftqt" data-m="${esc(r.x.m)}" inputmode="numeric" value="${r.q}"></td>
       <td><input class="ftus" data-m="${esc(r.x.m)}" inputmode="numeric" value="${r.uso}"></td></tr>`).join("")}
     </tbody></table>
     <p class="note" style="margin:0"><b>% de uso</b> = quanto tempo a ferramenta fica realmente puxando ar durante o trabalho. Já vem um valor típico para cada tipo (ex.: chave de impacto 15%, lixadeira 40%, pistola de pintura 60%). Se a ferramenta trabalha direto, sem parar, coloque 100%.</p>
     <label class="chk" for="ft_folga"><input type="checkbox" id="ft_folga" ${ftcfg.folga?"checked":""}> Somar 20% de folga (vazamentos e crescimento)</label>
     <div class="res">
      <div><span>Tudo ligado ao mesmo tempo</span><b>${fmt(c.bruto)} L/min</b>${fmt(ftPcm(c.bruto),1)} pcm · só como referência</div>
      <div><span>Consumo real estimado</span><b>${fmt(c.uso)} L/min</b>${fmt(ftPcm(c.uso),1)} pcm · % de uso × simultaneidade ${fmt(c.fs*100)}% (${c.n} ferramenta${c.n===1?"":"s"})</div>
      <div class="good"><span>Compressor recomendado</span><b>${fmt(c.rec)} L/min</b>${fmt(ftPcm(c.rec),1)} pcm · ${fmt(c.rec*0.06,1)} m³/h${c.cont>=c.rec-0.5&&c.cont>0?" · ajustado para atender sozinho a ferramenta de uso contínuo":""}</div>
     </div>
     <p class="note" style="margin:0">Cálculo pelo método usual de dimensionamento: soma do consumo de cada ferramenta × % de uso, vezes o fator de simultaneidade (quanto mais ferramentas, menor a chance de todas consumirem juntas). As ferramentas trabalham a 90 psi (6,2 bar); o compressor deve trabalhar a 7–8 bar.</p>
     <div class="row"><button type="button" class="btn" id="ft_dim">Ver compressores que atendem</button><button type="button" class="btn ghost" id="ft_clr">Limpar cálculo</button></div></div>`;
  }
  h+=`<div class="bar"><span>${list.length} ferramenta${list.length===1?"":"s"}</span></div>`;
  h+=list.length?list.map(ftCard).join(""):`<div class="empty">Nenhuma ferramenta encontrada.</div>`;
  return h;
}

// ---------- Kit booster completo (booster + compressor de parafuso + tratamento de ar + reservatórios) ----------
// Dados de entrada do catálogo: "Entrada 7/10/13 bar → 71/99/124 pcm", pareados com as saídas 30/35/40 bar.
let bk=load("cp_bk",{model:"PSBC430",pout:30,cliente:"",zap:"",secAlta:"",resIn:"",resOut:"",pb:"",pc:"",ps:"",pf:"",psa:"",pri:"",pro:"",inst:""});
function bkEntrada(it){
  const m=it.info.match(/Entrada ([\d/]+) bar → ([\d/]+) pcm/);
  if(m){const pin=m[1].split("/").map(Number),qin=m[2].split("/").map(Number);return{pin,qin,pout:it.pts.map(p=>p[0])}}
  const s=it.info.match(/Entrada (\d+) bar \/ (\d+) pcm/);
  return s?{pin:[+s[1]],qin:[+s[2]],pout:[it.pts[0][0]]}:null;
}
function bkCalc(){
  const it=C.find(c=>c.m===bk.model&&c.booster)||C.find(c=>c.booster);bk.model=it.m;
  const e=bkEntrada(it),P=numd(bk.pout);
  const r={it,P,e,ok:false};
  if(!e||!(P>0))return r;
  const lo=e.pout[0],hi=e.pout[e.pout.length-1];
  if(P>hi+1e-9){r.erro=`${it.m} vai até ${hi} bar de saída.`;return r}
  let t=0,i=0;
  if(e.pout.length>1&&P>lo){for(i=1;i<e.pout.length;i++)if(P<=e.pout[i])break;i=Math.min(i,e.pout.length-1);t=(P-e.pout[i-1])/(e.pout[i]-e.pout[i-1])}
  const lerp=(a)=>e.pout.length===1||P<=lo?a[0]:a[i-1]+(a[i]-a[i-1])*t;
  r.pin=Math.round(lerp(e.pin)*10)/10; r.qin=lerp(e.qin); r.lin=r.qin*LPCM;
  const fo=flowAt(it,Math.max(P,lo)); r.qout=fo?fo.pcm:null; r.lout=fo?fo.l:null;
  // compressor de parafuso: menor que entrega a vazão de entrada do booster (+10% de folga) na pressão de entrada
  const need=r.lin*1.1;
  const cs=C.filter(c=>c.tipo==="Parafuso").map(c=>({c,f:flowAt(c,r.pin)})).filter(x=>x.f&&x.f.l>=need).sort((a,b)=>a.f.l-b.f.l);
  r.comp=cs[0]||null; r.alt=cs.slice(1,3);
  r.sec=pickTreat(0,r.comp?r.comp.f.l:r.lin,r.pin);
  r.fil=(it.info.match(/pré-filtro (\S+)/)||[])[1]||pickTreat(5,r.lin,r.pin);
  r.ok=true; return r;
}
function bkTotal(){return["pb","pc","ps","pf","psa","pri","pro","inst"].reduce((s,k)=>s+(num(bk[k])||0),0)}
function bkText(r){
  const L=[],B=t=>`*${t}*`;
  L.push(B("KIT BOOSTER · "+(pr.empresa||"Stemax").toUpperCase()));
  if(bk.cliente)L.push("Cliente: "+bk.cliente);
  L.push(`Pressão de trabalho: ${fmt(r.P,1)} bar · vazão de saída ≈ ${fmt(r.lout)} L/min (${fmt(r.qout,1)} pcm)`);L.push("");
  L.push(B("Equipamentos"));
  L.push(`• Booster Puma ${r.it.m} (${fmt(r.it.cv,1)} cv) · entrada ${fmt(r.pin,1)} bar / ${fmt(r.qin)} pcm`);
  if(r.comp)L.push(`• Compressor de parafuso Puma ${r.comp.c.m} (${fmt(r.comp.c.cv,1)} cv) · ${fmt(r.comp.f.pcm,1)} pcm a ${fmt(r.pin,1)} bar`);
  if(r.sec)L.push(`• Secador por refrigeração Puma ${r.sec} (antes do booster)`);
  if(r.fil)L.push(`• Pré-filtro Puma ${r.fil}`);
  L.push(`• Reservatório de entrada (pulmão) para ${fmt(r.pin,1)} bar`);
  L.push(`• Secador de alta pressão para ${fmt(r.P,1)} bar`);
  L.push(`• Reservatório de alta pressão certificado NR-13 para ${fmt(r.P,1)} bar`);
  L.push("");L.push([pr.vend,pr.empresa,pr.fone].filter(Boolean).join("\n"));
  return L.join("\n");
}
function renderBkit(){
  const r=bkCalc();
  const t=(id,lab,val,ph="",mode="text")=>`<label class="f" for="${id}">${lab}<input id="${id}" inputmode="${mode}" value="${esc(val)}" placeholder="${esc(ph)}"></label>`;
  const pz=(id,lab)=>t(id,lab,bk[id.slice(3)],"R$","decimal");
  const opts=C.filter(c=>c.booster).map(c=>`<option ${c.m===r.it.m?"selected":""}>${c.m}</option>`).join("");
  let h=`<details class="convbox" id="bkbox" ${bk.aberto?"open":""}><summary style="cursor:pointer;list-style:none"><h2 style="display:inline">Montar kit booster completo</h2> <span class="note">compressor + tratamento + reservatórios</span></summary>
   <div class="form" style="margin-top:10px">
    <label class="f" for="bk_model">Booster<select id="bk_model">${opts}</select></label>
    ${t("bk_pout","Pressão de saída (bar)",bk.pout,"30","decimal")}
    ${t("bk_cliente","Cliente",bk.cliente,"Ex.: Indústria X")}
    ${t("bk_zap","WhatsApp do cliente",bk.zap,"85 9 9999-9999","tel")}
   </div>`;
  if(!r.ok){h+=`<div class="warn">${r.erro||"Informe a pressão de saída."}</div></details>`;return h}
  h+=`<div class="res" style="margin-top:8px">
     <div><span>Saída do booster</span><b>${fmt(r.lout)} L/min</b>${fmt(r.qout,1)} pcm a ${fmt(r.P,1)} bar</div>
     <div><span>Entrada do booster</span><b>${fmt(r.lin)} L/min</b>${fmt(r.qin,1)} pcm a ${fmt(r.pin,1)} bar</div>
   </div>
   <div class="tbl"><table class="ftt"><thead><tr><th>Itens do kit</th></tr></thead><tbody>
    <tr><td><b>1. Booster ${r.it.m}</b><br><span class="note">${fmt(r.it.cv,1)} cv · ${esc(r.it.info.split(" · ").slice(2,4).join(" · "))}</span></td></tr>
    <tr><td><b>2. Compressor de parafuso ${r.comp?r.comp.c.m:"—"}</b><br><span class="note">${r.comp?`${fmt(r.comp.c.cv,1)} cv · ${fmt(r.comp.f.pcm,1)} pcm a ${fmt(r.pin,1)} bar · ${esc(ficha(r.comp.c).trans||"")}${r.alt.length?"<br>Alternativas: "+r.alt.map(a=>a.c.m).join(", "):""}`:`nenhum parafuso da linha entrega ${fmt(r.qin*1.1,1)} pcm a ${fmt(r.pin,1)} bar sozinho; considere dois em paralelo`}</span></td></tr>
    <tr><td><b>3. Reservatório de entrada (pulmão)</b><br><span class="note">entre o compressor e o booster, para ${fmt(r.pin,1)} bar · estabiliza a alimentação do booster</span></td></tr>
    <tr><td><b>4. Secador por refrigeração ${r.sec||"—"}</b><br><span class="note">${r.sec?`entre o compressor e o booster, a ${fmt(r.pin,1)} bar`:"fora da faixa de pressão dos secadores TMB"}</span></td></tr>
    <tr><td><b>5. Pré-filtro ${r.fil||"—"}</b><br><span class="note">na entrada do booster (indicado no catálogo)</span></td></tr>
    <tr><td><b>6. Secador de alta pressão</b><br><span class="note">após o booster, para ${fmt(r.P,1)} bar · modelo não consta no catálogo, confirmar com a Puma</span></td></tr>
    <tr><td><b>7. Reservatório de alta pressão</b><br><span class="note">na saída do booster, certificado NR-13 para no mínimo ${fmt(r.P,1)} bar</span></td></tr>
   </tbody></table></div>
   <p class="note" style="margin:0">Compressor escolhido com 10% de folga sobre o consumo de entrada do booster. Entrada 7/10/13 bar pareada com saída 30/35/40 bar, como no catálogo; confirme com a Puma em aplicações críticas.</p>
   <div class="row"><button type="button" class="btn" id="bk_copy">Copiar lista do kit</button><a class="btn ghost" id="bk_wa" href="#" target="_blank" rel="noopener" style="text-decoration:none">Enviar no WhatsApp</a><span class="note" id="bk_st" style="margin:0"></span></div>
  </details>`;
  return h;
}
function bindBkit(){
  const box=$("#bkbox");if(!box)return;
  box.addEventListener("toggle",()=>{bk.aberto=box.open;store("cp_bk",bk)});
  const map={bk_model:"model",bk_pout:"pout",bk_cliente:"cliente",bk_zap:"zap"};
  for(const id in map){const el=$("#"+id);if(el)el.addEventListener("change",()=>{bk[map[id]]=el.value;bk.aberto=true;store("cp_bk",bk);render()})}
  const r=bkCalc();if(!r.ok)return;
  const txt=bkText(r),d=String(bk.zap).replace(/\D/g,""),ph=d?(d.length<=11?"55"+d:d):"";
  const wa=$("#bk_wa");if(wa)wa.href="https://wa.me/"+ph+"?text="+encodeURIComponent(txt);
  const cp=$("#bk_copy");if(cp)cp.onclick=async()=>{const st=$("#bk_st");try{await navigator.clipboard.writeText(txt);st.textContent="Kit copiado."}catch(e){st.textContent="Não deu para copiar neste aparelho."}};
}


// ---------- Corte a laser: compressores de parafuso que chegam a 16 bar + tratamento de ar ----------
let lz=load("cp_lz",{p:16,cons:""});
function lzCalc(L){
  const P=Math.min(Math.max(numd(lz.p)||16,12),16);
  const dem=numd(lz.cons)>0?numd(lz.cons):L;
  const all=C.filter(c=>c.tipo==="Parafuso"&&!c.single&&c.pts[c.pts.length-1][0]>=P-1e-9).map(c=>({c,f:flowAt(c,P)})).filter(x=>x.f).sort((a,b)=>a.f.l-b.f.l);
  const ok=dem?all.filter(x=>x.f.l>=dem*1.1):all;
  const best=ok[0]||null;
  const Lc=best?best.f.l:dem;
  return{P,dem,all,ok,best,sec:Lc?pickTreat(0,Lc,P):null,fil:Lc?pickTreat(5,Lc,P):null};
}
function renderLaser(L){
  const r=lzCalc(L);
  const t=(id,lab,val,ph="")=>`<label class="f" for="${id}">${lab}<input id="${id}" inputmode="decimal" value="${esc(val)}" placeholder="${esc(ph)}"></label>`;
  let h=`<div class="convbox"><h2>Compressores para corte a laser</h2>
   <p class="note" style="margin:0">Corte a laser com ar comprimido pede <b>alta pressão (13 a 16 bar)</b> e <b>ar seco e limpo</b> (sem água, óleo e partículas), senão a lente e o bico da máquina estragam. Abaixo, os parafusos Puma que trabalham a 16 bar e o tratamento de ar indicado.</p>
   <div class="form">
    ${t("lz_p","Pressão do laser (bar)",lz.p,"16")}
    ${t("lz_cons","Consumo de ar do laser (L/min)",lz.cons,L?fmt(L)+" (do topo)":"Veja no manual da máquina")}
   </div>
   <p class="note" style="margin:0">O consumo depende do bico e da espessura cortada: pegue no manual ou com o fabricante da máquina de laser. Vazio = usa a vazão do topo.</p></div>`;
  if(r.best){
    const it=r.best.c,fx=ficha(it);
    h+=`<div class="convbox"><h2>Kit recomendado para o laser</h2>
     <div class="tbl"><table class="ftt"><tbody>
      <tr><td><b>Compressor ${it.m}</b><br><span class="note">${fmt(it.cv,1)} cv · ${fmt(r.best.f.l)} L/min (${fmt(r.best.f.pcm,1)} pcm) a ${fmt(r.P,1)} bar · ${esc(fx.trans||"")}${/reservatório/.test(it.info)?" · reservatório "+(it.info.match(/reservatório (\d+ L)/)||[])[1]:""}${/secador/.test(it.info)?" · secador integrado":""}</span></td></tr>
      ${r.sec?`<tr><td><b>Secador por refrigeração ${r.sec}</b><br><span class="note">${/secador [\d,]+ kW/.test(it.info)?"o compressor já tem secador integrado; use este se quiser um secador separado na linha":"dimensionado para a vazão do compressor a "+fmt(r.P,1)+" bar"}</span></td></tr>`:""}
      ${r.fil?`<tr><td><b>Filtros ${r.fil} · elementos P + S + A</b><br><span class="note">P (3 µm) e S (0,01 µm, coalescente) tiram partículas e óleo; A (carvão ativado) tira vapor de óleo e cheiro. É o conjunto que protege a lente do laser.</span></td></tr>`:""}
      <tr><td><b>Purgador eletrônico</b><br><span class="note">no reservatório e nos filtros, para não voltar água para a linha</span></td></tr>
     </tbody></table></div>
     ${r.ok.length>1?`<p class="note" style="margin:0">Outras opções que atendem: ${r.ok.slice(1,4).map(x=>x.c.m).join(", ")}.</p>`:""}
     <p class="note" style="margin:0">Compressor escolhido com 10% de folga sobre o consumo do laser. Confirme com a Puma se há versão específica para laser (com secador e filtros integrados) do modelo indicado.</p></div>`;
  }else if(r.dem){
    h+=`<div class="warn">Nenhum parafuso da linha entrega ${fmt(r.dem*1.1)} L/min a ${fmt(r.P,1)} bar sozinho. Considere dois compressores em paralelo ou um booster.</div>`;
  }
  h+=`<div class="bar"><span>${r.all.length} parafusos Puma trabalham a ${fmt(r.P,1)} bar${r.dem?` · ${r.ok.length} atendem ${fmt(r.dem)} L/min (+10%)`:""}</span></div>`;
  h+=r.all.map(x=>compCard(x.c,x.f,r.dem||null,r.P,r.best&&x.c.m===r.best.c.m)).join("");
  return h;
}
function bindLaser(){
  ["lz_p","lz_cons"].forEach(id=>{const el=$("#"+id);if(el)el.addEventListener("change",()=>{lz[id.slice(3)]=el.value;store("cp_lz",lz);render()})});
}

renderTabs();render();
</script>
